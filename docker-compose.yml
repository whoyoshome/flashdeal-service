# Local development stack. Credentials here are for local use only.
# Jaeger, Prometheus and Grafana belong to the "observability" profile:
# `make up` starts them, CI's end-to-end job does not.
name: flashdeal

x-postgres-url: &postgres-url postgres://flashdeal:flashdeal@postgres:5432/flashdeal?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flashdeal
      POSTGRES_PASSWORD: flashdeal
      POSTGRES_DB: flashdeal
    ports:
      # Host side only; services reach postgres:5432 on the Compose network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashdeal -d flashdeal"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
      POSTGRES_URL: *postgres-url
      REDIS_ADDR: redis:6379
      # Local/dev HMAC key (also used by make token, k6, e2e). Never reuse in prod.
      JWT_SECRET: ${JWT_SECRET:-flashdeal-local-dev-secret-change-me!!}
      JWT_ISSUER: ${JWT_ISSUER:-flashdeal}
      # CI sets the endpoint empty: it runs without the observability profile.
      # Sampling a tenth of new traces keeps a k6 burst from flooding Jaeger.
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT-http://jaeger:4318}
      TRACING_SAMPLE_RATIO: ${TRACING_SAMPLE_RATIO-0.1}
      # Matches Prometheus' 1s scrape (deploy/prometheus.yml).
      STOCK_SAMPLE_EVERY: 1s
      # Overridable to compare against a single row (ADR 0011).
      STOCK_SHARDS: ${STOCK_SHARDS:-8}
      # Open the whole pool at startup so the first burst does not pay for
      # connection setup (ADR 0011).
      POSTGRES_MAX_CONNS: "20"
      POSTGRES_MIN_CONNS: "20"
    ports:
      - "127.0.0.1:8080:8080"
      # pprof; bound to the host's loopback so it is never exposed.
      - "127.0.0.1:6060:6060"
    healthcheck:
      test: ["CMD", "/flashdeal", "healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Must exceed SHUTDOWN_TIMEOUT so in-flight requests can drain.
    stop_grace_period: 20s

  # One-off migration runner: `make migrate`. Not started by `make up`.
  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path=/migrations", "-database", *postgres-url, "up"]
    depends_on:
      postgres:
        condition: service_healthy

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:16686:16686" # UI

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["observability"]
    environment:
      # Local only: anyone reaching the port can view dashboards; editing
      # still needs the admin login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/flashdeal.json
      # Keep the plugins bundled in the pinned image. Otherwise Grafana
      # downloads newer data source plugins at startup, and while one is
      # being replaced every panel using it fails.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
