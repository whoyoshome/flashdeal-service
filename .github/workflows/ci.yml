name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: OpenAPI contract
        run: make lint-api

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go mod tidy
        run: go mod tidy -diff
      - name: Unit tests (race detector)
        run: go test -race -count=1 ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Integration tests (testcontainers)
        run: go test -race -count=1 -tags=integration ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Start the stack
        # Without the observability profile, and with tracing off since no
        # collector runs.
        env:
          TRACING_OTLP_ENDPOINT: ""
        run: make up PROFILES= && make migrate
      - name: End-to-end tests
        run: make test-e2e
      - name: API logs
        if: failure()
        run: docker compose logs api
      - name: Stop the stack
        if: always()
        run: make down

  image:
    runs-on: ubuntu-latest
    needs: [lint, test, integration, e2e]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: flashdeal-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
