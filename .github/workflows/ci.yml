name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: OpenAPI contract
        run: make lint-api
      - name: Kubernetes manifests
        run: make lint-k8s

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod tidy
        run: go mod tidy -diff
      - name: Unit tests (race detector)
        run: go test -race -count=1 ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Integration tests (testcontainers)
        run: go test -race -count=1 -tags=integration ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Start the stack
        # Without the observability profile, and with tracing off since no
        # collector runs.
        env:
          TRACING_OTLP_ENDPOINT: ""
        run: make up PROFILES= && make migrate
      - name: End-to-end tests
        run: make test-e2e
      - name: API logs
        if: failure()
        run: docker compose logs api
      - name: Stop the stack
        if: always()
        run: make down

  k8s-smoke:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v4
      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: flashdeal-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: flashdeal-smoke
          wait: 120s
      - name: Load image and run the smoke
        env:
          IMAGE: flashdeal-service:ci
        run: |
          kind load docker-image "$IMAGE" --name flashdeal-smoke
          docker pull postgres:17-alpine
          docker pull redis:7.4-alpine
          kind load docker-image postgres:17-alpine --name flashdeal-smoke
          kind load docker-image redis:7.4-alpine --name flashdeal-smoke
          chmod +x deploy/k8s/smoke/run.sh
          ./deploy/k8s/smoke/run.sh

  image:
    runs-on: ubuntu-latest
    needs: [lint, test, integration, e2e, k8s-smoke]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Release tags v1.2.3 publish 1.2.3 and latest; main publishes main and
      # sha-<short>.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable=${{ github.ref_type == 'branch' }}
      # Pull requests only build: forks and unmerged code never reach GHCR.
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
