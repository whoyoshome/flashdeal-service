# Blueprint for a public portfolio demo on Render (free web service).
# Pair with Neon (Postgres) and Upstash (Redis). Step-by-step:
# deploy/cloud/README.md
#
# After the first deploy, put the service URL in the GitHub repo homepage
# and in the README "Live demo" section.

services:
  - type: web
    name: flashdeal
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DEMO_ENABLED
        value: "true"
      - key: MIGRATE_ON_START
        value: "true"
      - key: HTTP_ADDR
        value: ":8080"
      - key: ADMIN_ADDR
        value: "127.0.0.1:6060"
      - key: LOG_LEVEL
        value: info
      - key: JWT_ISSUER
        value: flashdeal
      - key: JWT_SECRET
        sync: false
      - key: POSTGRES_URL
        sync: false
      - key: POSTGRES_MAX_CONNS
        value: "5"
      - key: POSTGRES_MIN_CONNS
        value: "1"
      - key: POSTGRES_CONNECT_TIMEOUT
        value: 5s
      - key: POSTGRES_STATEMENT_TIMEOUT
        value: 5s
      - key: REDIS_URL
        sync: false
      - key: REDIS_POOL_SIZE
        value: "10"
      - key: REDIS_DIAL_TIMEOUT
        value: 2s
      - key: REDIS_READ_TIMEOUT
        value: 2s
      - key: REDIS_WRITE_TIMEOUT
        value: 2s
      - key: RATE_LIMIT_RPS
        value: "10"
      - key: RATE_LIMIT_BURST
        value: "20"
      - key: STOCK_SHARDS
        value: "32"
      - key: TRACING_OTLP_ENDPOINT
        value: ""
