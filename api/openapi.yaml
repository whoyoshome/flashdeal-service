openapi: 3.1.0
info:
  title: FlashDeal Service API
  version: 0.6.0
  summary: High-concurrency flash-sale API with zero overselling.
  description: |
    Sells a limited stock of a product during a short window. A user reserves
    units (held for a TTL, 5 minutes by default) and then confirms the
    reservation to create an order; unconfirmed reservations expire.

    Every error uses the same body: `{"code", "message", "request_id"}`.
    Clients may branch on `code`, which is stable.

    Authentication is out of scope: reservation endpoints identify the caller
    with the `X-User-ID` header. Admin endpoints are not protected yet.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8080
    description: Local Docker Compose stack

tags:
  - name: deals
    description: Create, activate and read deals.
  - name: reservations
    description: Reserve, confirm and cancel units of a deal.
  - name: health
    description: Liveness and readiness probes.

paths:
  /v1/deals:
    post:
      tags: [deals]
      operationId: createDeal
      security: []
      summary: Create a deal (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDealRequest'
      responses:
        '201':
          description: Deal created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [deals]
      operationId: listDeals
      security: []
      summary: List active deals
      description: Returns deals whose window contains the current time, ordered by id, using keyset pagination.
      parameters:
        - name: status
          in: query
          description: Only `active` is supported; omitting it means `active`.
          schema:
            type: string
            enum: [active]
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page. Omit for the first page.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          description: Page size. Defaults to 20 and is capped at 100.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: One page of active deals.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/deals/{id}:
    parameters:
      - $ref: '#/components/parameters/DealID'
    get:
      tags: [deals]
      operationId: getDeal
      security: []
      summary: Get a deal with its approximate available stock
      responses:
        '200':
          description: The deal.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/deals/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/DealID'
    post:
      tags: [deals]
      operationId: activateDeal
      security: []
      summary: Open a deal's stock for reservations (admin)
      description: |
        Loads the deal's available units into the stock gate. A deal must be
        activated before anyone can reserve it. Idempotent: activating again
        never resets a counter that reservations have already moved. Fails with
        `DEAL_NOT_ACTIVE` once the deal's window has closed, and with
        `STOCK_UNAVAILABLE` (503) if the gate is unreachable.
      responses:
        '200':
          description: The activated deal.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/deals/{id}/reservations:
    parameters:
      - $ref: '#/components/parameters/DealID'
    post:
      tags: [reservations]
      operationId: reserve
      summary: Reserve units of a deal
      description: |
        Holds units for the caller until the reservation is confirmed,
        cancelled or expires.

        **Idempotency.** Keys are scoped per caller. The first request with a
        key runs, and its final response (any 2xx or 4xx) is stored for 24 h:
        retries with the same key and the same request get exactly that
        response back, marked with `Idempotency-Replayed: true`, without
        running again. A retry while the first request is still running gets
        409 `IDEMPOTENCY_IN_PROGRESS` with `Retry-After`. The same key with a
        different request (other deal or body) gets 409 `CONFLICT`. 5xx
        responses are not stored, so retrying after one runs the request again.

        The deal must be activated first (`DEAL_NOT_ACTIVE` otherwise). The
        per-user limit is cumulative across all of the caller's reservations
        on the deal (`USER_LIMIT_REACHED`). If the stock gate is unreachable the
        service fails closed with 503 `STOCK_UNAVAILABLE` and sells nothing.
      security:
        - userId: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveRequest'
      responses:
        '201':
          description: Reservation created (or the original response, replayed on a retry).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The request conflicts with the current state: `SOLD_OUT`,
            `DEAL_NOT_ACTIVE`, `USER_LIMIT_REACHED`, `CONFLICT` (key reused for
            a different request) or `IDEMPOTENCY_IN_PROGRESS` (retry after
            `Retry-After` seconds). Final 409s are replayed on retries.
          headers:
            Retry-After:
              description: Seconds to wait; only on `IDEMPOTENCY_IN_PROGRESS`.
              schema:
                type: integer
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/reservations/{id}/confirm:
    parameters:
      - $ref: '#/components/parameters/ReservationID'
    post:
      tags: [reservations]
      operationId: confirmReservation
      summary: Confirm a reservation and create its order
      description: Payment is assumed approved. Only the reservation's owner may confirm it.
      security:
        - userId: []
      responses:
        '200':
          description: The order created by the confirmation.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Expired'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/reservations/{id}:
    parameters:
      - $ref: '#/components/parameters/ReservationID'
    delete:
      tags: [reservations]
      operationId: cancelReservation
      summary: Cancel a pending reservation and return its units
      description: Allowed while the reservation is pending, even after its TTL. Only the owner may cancel it.
      security:
        - userId: []
      responses:
        '204':
          description: Reservation cancelled.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /healthz:
    get:
      tags: [health]
      operationId: liveness
      security: []
      summary: Liveness probe
      description: Reports that the process is up. Never checks dependencies.
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /readyz:
    get:
      tags: [health]
      operationId: readiness
      security: []
      summary: Readiness probe
      description: Reports whether PostgreSQL and Redis are reachable.
      responses:
        '200':
          description: Every dependency is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: At least one dependency is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

components:
  securitySchemes:
    userId:
      type: apiKey
      in: header
      name: X-User-ID
      description: Caller identity. A placeholder for real authentication (JWT) later.

  parameters:
    DealID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ReservationID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-chosen key that makes the request safe to retry.
      schema:
        type: string
        minLength: 1
        maxLength: 255

  headers:
    X-Request-ID:
      description: Request identifier, also present in error bodies. Echoes a well-formed incoming value.
      schema:
        type: string
    Idempotency-Replayed:
      description: Present and `true` when the response is a stored one replayed for a retried Idempotency-Key.
      schema:
        type: string
        enum: ['true']

  schemas:
    CreateDealRequest:
      type: object
      additionalProperties: false
      required: [product_id, title, price_cents, currency, total_stock, per_user_limit, starts_at, ends_at]
      properties:
        product_id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        price_cents:
          type: integer
          format: int64
          minimum: 1
          description: Unit price in the currency's minor unit.
        currency:
          $ref: '#/components/schemas/Currency'
        total_stock:
          type: integer
          minimum: 1
        per_user_limit:
          type: integer
          minimum: 1
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          description: Exclusive end of the window; must be after starts_at.
      example:
        product_id: sku-123
        title: Noise-cancelling headphones
        price_cents: 4999
        currency: USD
        total_stock: 1000
        per_user_limit: 2
        starts_at: '2026-10-15T12:00:00Z'
        ends_at: '2026-10-15T13:00:00Z'

    Deal:
      type: object
      required: [id, product_id, title, price_cents, currency, total_stock, available_stock, per_user_limit, starts_at, ends_at, created_at]
      properties:
        id:
          type: integer
          format: int64
        product_id:
          type: string
        title:
          type: string
        price_cents:
          type: integer
          format: int64
        currency:
          $ref: '#/components/schemas/Currency'
        total_stock:
          type: integer
        available_stock:
          type: integer
          description: Approximate units left; the stock gate decides the real outcome of a reservation.
        per_user_limit:
          type: integer
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    DealList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Deal'
        next_cursor:
          type: integer
          format: int64
          description: Pass as `cursor` to get the next page. Absent on the last page.

    ReserveRequest:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          description: Units to hold; together with the caller's other reservations on the deal, at most its per_user_limit.
      example:
        quantity: 1

    Reservation:
      type: object
      required: [id, deal_id, user_id, quantity, status, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        deal_id:
          type: integer
          format: int64
        user_id:
          type: string
        quantity:
          type: integer
        status:
          type: string
          enum: [pending, confirmed, expired, cancelled]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Order:
      type: object
      required: [id, reservation_id, deal_id, user_id, quantity, total_cents, currency, created_at]
      properties:
        id:
          type: string
          format: uuid
        reservation_id:
          type: string
          format: uuid
        deal_id:
          type: integer
          format: int64
        user_id:
          type: string
        quantity:
          type: integer
        total_cents:
          type: integer
          format: int64
        currency:
          $ref: '#/components/schemas/Currency'
        created_at:
          type: string
          format: date-time

    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: ISO 4217 code.
      example: USD

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]

    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Stable error code.
          enum:
            - VALIDATION_ERROR
            - NOT_FOUND
            - SOLD_OUT
            - DEAL_NOT_ACTIVE
            - USER_LIMIT_REACHED
            - RESERVATION_EXPIRED
            - CONFLICT
            - STOCK_UNAVAILABLE
            - UNAUTHENTICATED
            - METHOD_NOT_ALLOWED
            - REQUEST_TIMEOUT
            - IDEMPOTENCY_IN_PROGRESS
            - INTERNAL
        message:
          type: string
        request_id:
          type: string

  responses:
    BadRequest:
      description: The request is malformed or breaks a validation rule (`VALIDATION_ERROR`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Missing or invalid `X-User-ID` header (`UNAUTHENTICATED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The deal or reservation does not exist, or belongs to another user (`NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        The request conflicts with the current state: `SOLD_OUT`,
        `DEAL_NOT_ACTIVE`, `USER_LIMIT_REACHED` or `CONFLICT` (reservation not
        pending, or idempotency key reused for a different request).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Expired:
      description: The reservation's TTL elapsed before confirmation (`RESERVATION_EXPIRED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: |
        Temporarily unable to serve the request; retry after `Retry-After`
        seconds. `STOCK_UNAVAILABLE`: the stock gate is unreachable and the
        service fails closed. `REQUEST_TIMEOUT`: the request exceeded its
        time budget, usually under overload; nothing was written, and a retry
        with the same `Idempotency-Key` is safe.
      headers:
        Retry-After:
          description: Seconds to wait before retrying (only on `REQUEST_TIMEOUT`).
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected failure (`INTERNAL`); details are only in the server log.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
