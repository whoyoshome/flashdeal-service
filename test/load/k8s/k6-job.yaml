# k6 flash-sale scenario run inside the cluster, next to the API, so traffic
# reaches the Service directly instead of through kubectl port-forward.
# Apply it with test/load/k8s/run.sh, which creates the two ConfigMaps it
# reads: flashdeal-k6-scripts (test/load/*.js) and flashdeal-k6-params
# (STOCK, PEAK_RPS, RAMP, HOLD, THRESHOLDS).
apiVersion: batch/v1
kind: Job
metadata:
  name: flashdeal-k6
  namespace: flashdeal
  labels:
    app.kubernetes.io/name: flashdeal-k6
    app.kubernetes.io/part-of: flashdeal
spec:
  # A failed threshold is a result, not a flake: never rerun it.
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flashdeal-k6
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: grafana/k6:2.3.0
          # The summary is printed after a marker so run.sh can extract it
          # from the logs; k6's exit code (99 on a crossed threshold) is kept.
          command: ["sh", "-c"]
          args:
            - >-
              k6 run --summary-export=/tmp/summary.json /scripts/flash_sale.js;
              rc=$?;
              echo '--- k6 summary ---';
              cat /tmp/summary.json;
              exit $rc
          env:
            - name: BASE_URL
              value: http://flashdeal-api.flashdeal.svc.cluster.local:8080
            - name: JWT_ISSUER
              value: flashdeal
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: flashdeal-secrets
                  key: jwt-secret
          envFrom:
            - configMapRef:
                name: flashdeal-k6-params
          resources:
            requests:
              cpu: "1"
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: flashdeal-k6-scripts
        - name: tmp
          emptyDir: {}
