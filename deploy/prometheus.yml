# Prometheus for the local stack (docker compose, "observability" profile).
global:
  # A flash sale is over in seconds: the gate of a 1,000-unit deal empties in
  # under one. Scraping every second, like the stock sampler in Docker
  # Compose (STOCK_SAMPLE_EVERY=1s), is what lets the dashboard show it fall.
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: flashdeal-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
