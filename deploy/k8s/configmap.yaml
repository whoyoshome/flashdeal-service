apiVersion: v1
kind: ConfigMap
metadata:
  name: flashdeal-config
  namespace: flashdeal
  labels:
    app.kubernetes.io/name: flashdeal
data:
  HTTP_ADDR: ":8080"
  # pprof only on the pod's loopback: reach it with kubectl port-forward.
  ADMIN_ADDR: "127.0.0.1:6060"
  LOG_LEVEL: info
  JWT_ISSUER: flashdeal
  REDIS_ADDR: redis:6379
  REQUEST_TIMEOUT: 5s
  RESERVATION_TTL: 5m
  IDEMPOTENCY_TTL: 24h
  DEAL_CACHE_TTL: 2s
  EXPIRE_EVERY: 5s
  EXPIRE_BATCH_SIZE: "100"
  RECONCILE_EVERY: 30s
  STOCK_SAMPLE_EVERY: 5s
  SHUTDOWN_TIMEOUT: 15s
  READINESS_TIMEOUT: 2s
  RATE_LIMIT_RPS: "50"
  RATE_LIMIT_BURST: "100"
  STOCK_SHARDS: "32"
  # order.confirmed events, at least once (ADR 0012)
  OUTBOX_EVERY: "1s"
  OUTBOX_STREAM: "flashdeal:events"
  # Open the whole pool at startup: a flash sale's first burst should not
  # pay for connection setup (ADR 0011).
  POSTGRES_MAX_CONNS: "20"
  POSTGRES_MIN_CONNS: "20"
  # Empty disables tracing until an OTLP collector is wired.
  TRACING_OTLP_ENDPOINT: ""
  TRACING_SAMPLE_RATIO: "0.1"
