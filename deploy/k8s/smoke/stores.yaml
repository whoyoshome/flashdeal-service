# Ephemeral Postgres and Redis for the CI kind smoke. Not for production.
apiVersion: v1
kind: Namespace
metadata:
  name: stores
---
apiVersion: v1
kind: Pod
metadata:
  name: postgres
  namespace: stores
  labels: {app: postgres}
spec:
  containers:
    - name: postgres
      image: postgres:17-alpine
      env:
        - {name: POSTGRES_USER, value: flashdeal}
        - {name: POSTGRES_PASSWORD, value: flashdeal}
        - {name: POSTGRES_DB, value: flashdeal}
      readinessProbe:
        exec: {command: ["pg_isready", "-U", "flashdeal", "-d", "flashdeal"]}
        periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: stores}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: v1
kind: Pod
metadata:
  name: redis
  namespace: stores
  labels: {app: redis}
spec:
  containers:
    - name: redis
      image: redis:7.4-alpine
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: stores}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
apiVersion: v1
kind: Namespace
metadata:
  name: flashdeal
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: flashdeal}
spec:
  type: ExternalName
  externalName: postgres.stores.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: flashdeal}
spec:
  type: ExternalName
  externalName: redis.stores.svc.cluster.local
