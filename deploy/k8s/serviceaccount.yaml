apiVersion: v1
kind: ServiceAccount
metadata:
  name: flashdeal-api
  namespace: flashdeal
  labels:
    app.kubernetes.io/name: flashdeal
# The API never calls the Kubernetes API, so pods get no token.
automountServiceAccountToken: false
# GHCR packages of a private repository need a pull secret; see README.
imagePullSecrets:
  - name: ghcr-pull
