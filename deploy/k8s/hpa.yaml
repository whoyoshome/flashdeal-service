apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flashdeal-api
  namespace: flashdeal
  labels:
    app.kubernetes.io/name: flashdeal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flashdeal-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
