apiVersion: apps/v1
kind: Deployment
metadata:
  name: flashdeal-api
  namespace: flashdeal
  labels:
    app.kubernetes.io/name: flashdeal
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: flashdeal
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flashdeal
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: flashdeal-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 6060
          envFrom:
            - configMapRef:
                name: flashdeal-config
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: flashdeal-secrets
                  key: postgres-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: flashdeal-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Liveness: process is up. Never checks Postgres/Redis so a store
          # outage does not restart healthy replicas.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: dependencies reachable; stop routing when not.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      # Must exceed SHUTDOWN_TIMEOUT (15s) so in-flight requests can drain.
      terminationGracePeriodSeconds: 25
