apiVersion: apps/v1
kind: Deployment
metadata:
  name: flashdeal-api
  namespace: flashdeal
  labels:
    app.kubernetes.io/name: flashdeal
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.8.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: flashdeal
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the current replica count during a rollout.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flashdeal
        app.kubernetes.io/component: api
        app.kubernetes.io/version: "0.8.0"
    spec:
      serviceAccountName: flashdeal-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The distroless "nonroot" user.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas over nodes so losing one node does not stop a sale.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: flashdeal
              app.kubernetes.io/component: api
      containers:
        - name: api
          # Immutable release tag published by CI from the v0.8.0 git tag.
          image: ghcr.io/whoyoshome/flashdeal-service:0.8.0
          imagePullPolicy: IfNotPresent
          # pprof listens on 127.0.0.1:6060 (ADMIN_ADDR) and is reachable only
          # through kubectl port-forward, so it is not declared here.
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: flashdeal-config
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: flashdeal-secrets
                  key: postgres-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: flashdeal-secrets
                  key: jwt-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Liveness: process is up. Never checks Postgres/Redis so a store
          # outage does not restart healthy replicas.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: dependencies reachable; stop routing when not.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      # Must exceed SHUTDOWN_TIMEOUT (15s) so in-flight requests can drain.
      terminationGracePeriodSeconds: 25
